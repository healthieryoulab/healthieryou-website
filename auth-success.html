<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Verified · Healthier You Calorie</title>
  <style>
    :root {
      --accent: #E17F4F;
      --bg: #FBF6EF;
      --text: #2A2A2A;
      --muted: #6B6B6B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
    }
    .check {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 600;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 8px;
    }
    .divider {
      height: 1px;
      background: #EEE;
      margin: 28px 0;
    }
    .lang-zh h1 { font-size: 20px; }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>

    <h1>Email verified</h1>
    <p>Your email is confirmed. You can close this page and return to the Healthier You Calorie app to sign in.</p>

    <div class="divider"></div>

    <div class="lang-zh">
      <h1>邮箱已验证</h1>
      <p>邮箱验证成功。你可以关闭此页面，回到 Healthier You · 饮食日记 App 登录。</p>
    </div>

    <div class="divider"></div>

    <p style="font-size: 13px;">
      Need help? Contact <a href="mailto:healthieryou.support@gmail.com">healthieryou.support@gmail.com</a>
    </p>
  </div>
</body>
</html>
